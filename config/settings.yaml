# 파이프라인 동작 설정

collect:
  window_hours: 12          # 최근 몇 시간 이내 기사만 사용
  min_items: 6              # 새 기사가 이보다 적으면 이번 회차는 건너뜀
  max_items: 45             # Claude에게 넘길 최대 기사 수
  max_per_source: 8         # 출처 하나당 최대 기사 수
  request_timeout: 15       # 초
  seen_keep_days: 14        # 중복 방지 기록 보관 기간
  exclude_keywords:         # 제목에 들어가면 제외
    - "[포토]"
    - "[사진]"
    - "[부고]"
    - "[인사]"
    - "[게시판]"
    - "운세"
    - "광고"

claude:
  max_turns: 30
  timeout_minutes: 20
  fix_retries: 1           # 검증 실패 시 오류를 알려주고 고치게 하는 횟수
  allowed_tools: "Read,Write,Edit,Glob,Grep,WebFetch"
  # model: claude-sonnet-4-5   # 비워두면 Claude Code 기본 모델 (환경변수 CLAUDE_MODEL 이 우선)

validate:
  post:
    min_chars: 1500         # 공백 제외 글자 수
    max_chars: 7000
    min_sources: 3
    required_headings: ["## 한눈에 보기", "## 출처"]
    title_len: [10, 70]
    description_len: [40, 160]
  naver:
    min_chars: 800
    max_chars: 4500
    max_similarity_to_post: 0.35
    categories: ["경제", "시사", "오늘의 브리핑"]   # 네이버 블로그 메뉴 이름과 같게 (일상은 직접 쓰는 글용이라 제외)   # 사이트 글과 너무 비슷하면 네이버 유사문서 위험
  max_copy_chars: 25        # 기사 제목·요약과 연속으로 겹치는 글자 수 상한 (공백·문장부호 제외)
  allowed_extra_domains: [] # 출처 목록 외에 링크를 허용할 도메인 (예: ecos.bok.or.kr)
  banned_phrases:
    - "매수하세요"
    - "매도하세요"
    - "무조건 오른다"
    - "무조건 내린다"
    - "확실한 수익"
    - "원금 보장"
    - "지금 사야"
