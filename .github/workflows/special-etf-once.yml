# 한 번만 쓰는 특별편: 한국·미국 지수 ETF 정리 → 2026-11-30(월) 08:30 텔레그램 전송
# GitHub 예약은 40~80분 늦게 시작하므로 06:30에 시작해 send.py 가 08:30까지 기다렸다 보낸다.
# 08:10 예약은 첫 예약이 아예 안 돌았을 때를 위한 예비. 이미 보냈으면(sent 표시) 건너뛴다.
# 보낸 뒤에는 이 파일을 지워도 된다.
name: special-etf-once

on:
  schedule:
    - cron: "30 21 29 11 *"   # 11/30(월) 06:30 KST
    - cron: "10 23 29 11 *"   # 11/30(월) 08:10 KST (예비)
  workflow_dispatch:
    inputs:
      check_only:
        description: "점검만 (텔레그램 전송 안 함)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: special-etf-once
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      TZ: Asia/Seoul
      BOX: special/2026-11-30-etf
    steps:
      - uses: actions/checkout@v4
      - name: Guard (date / already sent)
        id: guard
        run: |
          go=true
          if [ -f "$BOX/sent" ]; then echo "이미 보냄: $(cat $BOX/sent)"; go=false; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%F)" != "2026-11-30" ]; then
            echo "날짜가 2026-11-30 이 아님 → 건너뜀"; go=false; fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - name: Check kit pages are live
        if: steps.guard.outputs.go == 'true'
        run: |
          for p in naver tistory; do
            u="https://woosangji-hi.github.io/news-auto-blog/kit/2026-11-30-0830-etf-$p/"
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u"); echo "$code $u"
          done
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"
      - if: steps.guard.outputs.go == 'true'
        run: pip install requests PyYAML
      - name: Send at 08:30
        if: steps.guard.outputs.go == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.check_only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send.py --outbox "$BOX/outbox.json" --max-wait-min 130
      - name: Mark as sent
        if: steps.guard.outputs.go == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.check_only)
        run: |
          date '+%F %T KST' > "$BOX/sent"
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add "$BOX/sent"
          git commit -m "special: ETF 특별편 전송 완료"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
