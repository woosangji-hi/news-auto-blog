name: news-brief

# 하루 4회. 발행 목표 시각보다 25분 일찍 시작 (GitHub 예약 실행은 혼잡 시 수십 분 늦어질 수 있음)
# GitHub cron은 UTC 기준. 회차는 실행 시각(한국 시간)으로 settings.yaml 의 slots 에서 자동 선택.
#   08:00 오늘의 브리핑  ← KST 07:35 = UTC 22:35 (전날)
#   12:00 시사           ← KST 11:35 = UTC 02:35
#   15:00 경제           ← KST 14:35 = UTC 05:35
#   18:00 일상           ← KST 17:35 = UTC 08:35
on:
  schedule:
    - cron: "35 22 * * *"
    - cron: "35 2 * * *"
    - cron: "35 5 * * *"
    - cron: "35 8 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "회차 (auto = 지금 시각 기준)"
        type: choice
        options: [auto, brief, noon, afternoon, evening]
        default: auto
      dry_run:
        description: "수집만 테스트 (Claude 호출 안 함)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          # 한글 글꼴 (복붙 키트 그림용) — Google Fonts 저장소의 나눔고딕(OFL)
          mkdir -p fonts
          curl -fsSL -o fonts/NanumGothic-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Regular.ttf || true
          curl -fsSL -o fonts/NanumGothic-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/NanumGothic-Bold.ttf || true
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/pipeline.py --slot "${{ inputs.slot || 'auto' }}" --dry-run
          else
            python scripts/pipeline.py --slot "${{ inputs.slot || 'auto' }}"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            logs/
            rejected/
            data/raw/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit
        id: commit
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/_posts site/kit drafts data/seen.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음"
          else
            git commit -m "brief: $(date +%Y-%m-%d-%H%M)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # GITHUB_TOKEN으로 한 push는 다른 워크플로를 깨우지 않으므로 여기서 바로 배포
  deploy:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
