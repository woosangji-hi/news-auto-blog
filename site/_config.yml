# ── 꼭 바꿀 항목 ─────────────────────────────────────
title: "오늘의 경제 브리핑"
description: "하루 세 번, 꼭 알아야 할 경제·사회 이슈를 한 번에 정리합니다."
url: "https://woosangji-hi.github.io"   # 자체 도메인 연결 시 그 주소로 변경 (애드센스는 자체 도메인 권장)
baseurl: "/news-auto-blog"         # 자체 도메인 연결 시 "" 로 변경. 프로젝트 페이지(username.github.io/repo)라면 "/repo"
author: "브리핑 편집부"
contact_email: "you@example.com"

# 애드센스 승인 후 입력 (ca-pub-로 시작). 비워두면 광고 코드가 출력되지 않음
adsense_client: ""
adsense_slot_article: ""           # 수동 광고 단위 ID (자동광고만 쓰면 비워둠)

# 사이트 소유 확인용 (선택)
google_site_verification: ""
naver_site_verification: ""

# ── 일반 설정 ─────────────────────────────────────────
lang: ko
locale: ko_KR
timezone: Asia/Seoul
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
feed:
  posts_limit: 30
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "kit" }          # 발행 키트(복붙용) 페이지는 사이트맵에서 제외
    values: { sitemap: false }
exclude:
  - README.md
