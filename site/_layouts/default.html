<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
{% include head.html %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/archive/' | relative_url }}">전체 글</a>
        <a href="{{ '/about/' | relative_url }}">소개</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>이 사이트의 글은 공개된 뉴스와 공공자료를 바탕으로 정리한 정보 제공용 콘텐츠이며, 투자 권유가 아닙니다.
        원문 기사의 저작권은 각 언론사에 있습니다.</p>
      <p>
        <a href="{{ '/about/' | relative_url }}">소개</a> ·
        <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a> ·
        <a href="mailto:{{ site.contact_email }}">문의</a> ·
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </p>
      <p>© {{ site.time | date: '%Y' }} {{ site.title }}</p>
    </div>
  </footer>
</body>
</html>
